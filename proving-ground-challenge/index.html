<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proving Ground Challenge | 4 Weeks. $99. Prove It.</title>
<meta name="description" content="A 4-week hybrid fitness challenge. Lift, run, score. $99 entry, cash prize pool, 3 divisions.">
<meta property="og:title" content="Proving Ground Challenge | 4 Weeks. $99.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f0d;--cream:#f4ecdc;--cream-dim:rgba(244,236,220,.62);--line:rgba(244,236,220,.12);--rust:#b0532b;--rust-hot:#d4683a;--gold:#c9a24b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--cream);font-family:'Inter',system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
h1,h2{font-family:'Oswald',sans-serif;text-transform:uppercase;line-height:1.02}
.hero{min-height:100svh;display:flex;align-items:center;padding:120px 0 90px;text-align:center}
.hero h1{font-size:clamp(58px,15vw,150px);line-height:.94}
.hero h1 .stroke{color:transparent;-webkit-text-stroke:2px var(--cream)}
.hero h1 .rust{color:var(--rust-hot)}
.hero-sub{color:var(--cream-dim);font-size:20px;max-width:620px;margin:26px auto 0}
.cta-row{display:flex;gap:14px;justify-content:center;margin-top:38px}
.btn{display:inline-block;font-family:'Oswald',sans-serif;font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;padding:18px 42px;border-radius:6px;text-decoration:none;background:linear-gradient(135deg,var(--rust-hot),var(--rust));color:#fff}
.hero-stats{display:flex;justify-content:center;margin-top:56px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hstat{padding:22px 34px;text-align:center}
.hstat .n{font-family:'Archivo Black',sans-serif;font-size:36px;color:var(--gold)}
.hstat .l{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cream-dim);margin-top:6px}
.final{text-align:center;padding:84px 0}
.final h2{font-size:clamp(42px,10vw,92px)}
.final h2 .gold{color:var(--gold)}
.price-line{margin:26px 0 8px;font-family:'Archivo Black',sans-serif;font-size:20px}
footer{padding:44px 0;text-align:center;color:var(--cream-dim);font-size:13px}
footer a{color:var(--gold)}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
<h1><span class="stroke">4 Weeks.</span><br><span class="rust">Prove It.</span></h1>
<p class="hero-sub">Lift. Run. Score. 28 days of hybrid programming. Cash on the line. No hiding.</p>
<div class="cta-row"><a class="btn" href="https://buy.stripe.com/28E3cveLe4CF8CybqNeIw02" target="_blank" rel="noopener">Enter for $99</a></div>
<div class="hero-stats">
<div class="hstat"><div class="n">28</div><div class="l">Days</div></div>
<div class="hstat"><div class="n">370</div><div class="l">Points</div></div>
<div class="hstat"><div class="n">3</div><div class="l">Divisions</div></div>
<div class="hstat"><div class="n">40%</div><div class="l">To prize pool</div></div>
</div>
</div></header>
<section class="final"><div class="wrap">
<h2>Stop wondering.<br><span class="gold">Start proving.</span></h2>
<p class="price-line">$99 entry</p>
<div class="cta-row"><a class="btn" href="https://buy.stripe.com/28E3cveLe4CF8CybqNeIw02" target="_blank" rel="noopener">Claim your spot · $99</a></div>
</div></section>
<footer><div class="wrap"><p>Proving Ground Challenge · <a href="mailto:hello@orielaco.com">hello@orielaco.com</a></p></div></footer>
</body>
</html>
